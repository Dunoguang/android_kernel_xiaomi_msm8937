name: Build Kernel (Xiaomi Redmi 8/8A / MSM8937)

on:
  push:
    branches: [ '**' ]
    tags-ignore: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CCACHE_MAXSIZE: 4G
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_NOCOMPRESS: "true"
      CCACHE_DIR: /home/runner/.ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Restore workspace (with build output)
        id: ws-restore
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ${{ github.workspace }}
            !${{ github.workspace }}/.git
          key: ws-msm8937-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/vendor/msm8937-perf_defconfig') }}-${{ github.run_id }}
          restore-keys: |
            ws-msm8937-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/vendor/msm8937-perf_defconfig') }}-
            ws-msm8937-${{ runner.os }}-

      - name: Update repo to latest
        run: |
          git fetch origin
          git reset --hard origin/lineage-23.2
          git submodule foreach --recursive 'git reset --hard HEAD; git clean -fdx' 2>/dev/null || true
          git submodule update --init --recursive
          if git -C KernelSU rev-parse --is-shallow-repository 2>/dev/null | grep -q true; then
            git -C KernelSU fetch --unshallow origin
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc-aarch64-linux-gnu \
            flex bison bc libssl-dev ccache zip
          clang --version | head -1

      - name: Restore ccache
        id: cache-restore
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.ccache
          key: ccache-msm8937-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/vendor/msm8937-perf_defconfig') }}-${{ github.run_id }}
          restore-keys: |
            ccache-msm8937-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/vendor/msm8937-perf_defconfig') }}-
            ccache-msm8937-${{ runner.os }}-

      - name: Setup ccache
        run: |
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          ccache -M 4G
          ccache -z

      - name: Generate/Refresh .config
        run: |
          make O=out ARCH=arm64 vendor/msm8937-perf_defconfig
          scripts/config --file out/.config --enable KSU_MANUAL_HOOK
          scripts/config --file out/.config --disable KSU_TRACEPOINT_HOOK
          scripts/config --file out/.config --enable SECCOMP
          scripts/config --file out/.config --enable SECCOMP_FILTER
          make O=out ARCH=arm64 olddefconfig
          grep -E '^CONFIG_(KSU|KSU_MANUAL_HOOK|SECCOMP|KALLSYMS|BUILD_ARM64|DEVTMPFS|IPC_NS|USER_NS|FW_LOADER_COMPRESS)=' out/.config || true

      - name: Build kernel Image
        run: |
          echo "::group::Building Image"
          set -o pipefail
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) security/selinux/ 2>&1 | tail -3 || true
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image 2>&1 | tee /tmp/build.log
          echo "::endgroup::"
          ls -lh out/arch/arm64/boot/Image
          file out/arch/arm64/boot/Image

      - name: Report ReSukiSU version
        run: |
          VCODE=$(grep -oE "ReSukiSU version code: [0-9]+" /tmp/build.log | head -1 | awk '{print $NF}')
          VNAME=$(grep -oE "ReSukiSU version name: .+" /tmp/build.log | head -1 | sed 's/.*name: //')
          HOOK=$(grep -oE "ReSukiSU: using [A-Za-z ]+Hook" /tmp/build.log | head -1 | sed 's/.*using //')
          { echo "## ReSukiSU (Manual Hook)"; echo ""; echo "- **Version code**: $VCODE"; echo "- **Version name**: $VNAME"; echo "- **Hook method**: $HOOK"; } >> "$GITHUB_STEP_SUMMARY"
          echo "vcode=$VCODE" >> "$GITHUB_ENV"

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.ccache
          key: ccache-msm8937-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/vendor/msm8937-perf_defconfig') }}-${{ github.run_id }}

      - name: Checkout AnyKernel3
        uses: actions/checkout@v7.0.1
        with:
          repository: osm0sis/AnyKernel3
          path: AnyKernel3

      - name: Package AnyKernel3 zip
        run: |
          cp out/arch/arm64/boot/Image AnyKernel3/Image
          cd AnyKernel3
          sed -i 's/device.name1=maguro/device.name1=olive/' anykernel.sh
          sed -i 's/device.name2=toro/device.name2=olivelite/' anykernel.sh
          sed -i 's/device.name3=toroplus/device.name3=/' anykernel.sh
          sed -i 's/device.name4=tuna/device.name4=/' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0/IS_SLOT_DEVICE=0/' anykernel.sh
          sed -i 's/BLOCK=\/dev\/block\/platform\/omap/BLOCK=auto/' anykernel.sh
          TS=$(TZ=Asia/Shanghai date +%Y%m%d%H%M%S)
          ZIP="OLIVE-RSSU${vcode}-ByDunoguang-${TS}-AK3.zip"
          zip -r9 "$ZIP" * -x .git README.md '*placeholder'
          cd ..
          mv "AnyKernel3/$ZIP" .
          echo "ak3_zip=$ZIP" >> "$GITHUB_ENV"
          echo "::notice::AK3 artifact: ${ZIP} ($(du -h "$ZIP" | cut -f1))"
          unzip -l "$ZIP" | grep -E "Image|anykernel.sh"

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.ak3_zip }}
          path: ${{ env.ak3_zip }}

      - name: Upload AK3 to Tempfile
        if: always()
        continue-on-error: true
        run: |
          if [ ! -f "${ak3_zip}" ]; then
            echo "AK3 zip missing, skip" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          RESP=$(curl -sS -X POST https://tempfile.org/api/upload/local \
            -F "files=@${ak3_zip}" -F "expiryHours=48")
          URL=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['files'][0]['url'] + 'download')")
          cat >> "$GITHUB_STEP_SUMMARY" << EOM
          ## AK3 Tempfile 下载
          | Artifact | Link | Size | Expiry |
          |----------|------|------|--------|
          | ${ak3_zip} | [download](${URL}) | $(du -h "$ak3_zip" | cut -f1) | 48h |

          > \`${URL}\`
          EOM
          echo "AK3_TEMP_URL=${URL}"

      - name: Save workspace (with build output)
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ${{ github.workspace }}
            !${{ github.workspace }}/.git
          key: ws-msm8937-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/vendor/msm8937-perf_defconfig') }}-${{ github.run_id }}
